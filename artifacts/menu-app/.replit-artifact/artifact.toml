kind = "web"
previewPath = "/"
title = "AudiVerse — Menú + Premium PayPal"
version = "1.0.0"
id = "artifacts/menu-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23650

[services.development]
run = "npm run dev --workspace=@workspace/menu-app"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/menu-app" ]
publicDir = "artifacts/menu-app/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23650"
BASE_PATH = "/"
